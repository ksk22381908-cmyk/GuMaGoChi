<!doctype html><html lang="ko"><meta charset="utf-8"><title>B안 아기고구마 동작</title>
<style>body{font:16px sans-serif;background:#fff6dd;color:#413037;padding:24px}main{display:flex;flex-wrap:wrap;gap:18px}section{text-align:center;background:#fffaf0;padding:16px;border-radius:12px}canvas{image-rendering:pixelated}button{padding:10px;font:inherit}</style>
<h1>B안 · 꼬마 새싹</h1><p>6개 동작 / 각 4프레임</p><button id="toggle">일시정지</button><main></main>
<script>
const bands=[{"height": 220, "top": 55, "bottom": 275}, {"height": 219, "top": 301, "bottom": 520}, {"height": 229, "top": 552, "bottom": 781}, {"height": 218, "top": 815, "bottom": 1033}, {"height": 203, "top": 1073, "bottom": 1276}, {"height": 214, "top": 1291, "bottom": 1505}],names=['대기','걷기','먹기','공 던지기','수면','땅속 들어가기'];let playing=true,frame=0;
const contexts=names.map(name=>{const s=document.createElement('section'),h=document.createElement('h2'),c=document.createElement('canvas');h.textContent=name;c.width=c.height=192;s.append(h,c);document.querySelector('main').append(s);return c.getContext('2d')});
const img=new Image();img.src='baby-b-atlas.png';const eating=new Image();eating.src='baby-b-eat-corrected.png';
function draw(){if(!img.complete||!img.naturalWidth||!eating.complete||!eating.naturalWidth)return;contexts.forEach((ctx,row)=>{ctx.clearRect(0,0,192,192);ctx.imageSmoothingEnabled=false;const b=bands[row],source=row===2?eating:img,w=source.naturalWidth/4;ctx.drawImage(source,frame*w,b.top,w,b.height,0,192-b.height*192/w,192,b.height*192/w)})}
img.onload=draw;setInterval(()=>{if(playing){frame=(frame+1)%4;draw()}},250);document.querySelector('#toggle').onclick=e=>{playing=!playing;e.target.textContent=playing?'일시정지':'재생'};
</script></html>
