<!doctype html><html lang="ko"><meta charset="utf-8"><title>성체 액션 미리보기</title><style>body{background:#fff6dd;color:#413037;font:16px sans-serif;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.sprite{width:160px;height:160px;background-size:640px 640px;image-rendering:pixelated;background-color:#ddd}article{padding:12px;background:#fff;border-radius:12px}select,button{font:inherit;padding:8px;margin:8px}</style><h1>성체 30종 액션 초안</h1><p>걷기 · 먹기 · 공 쏘기 · 땅속 들어가기 / 동작당 4프레임</p><select id="motion"><option value="0">걷기</option><option value="1">먹기</option><option value="2">공 쏘기</option><option value="3">땅속 들어가기</option></select><button id="play">일시정지</button><main></main><script>const names=["밤톨이","꿀떡이","자몽이","군밤이","새싹이","딸기마","구름이","달콩이","햇살이","눈송이","왕고마","마법마","해적마","요리마","화가마","음표마","책벌레마","탐험마","우주마","별똥이","꽃송이","버섯마","개굴마","냥고마","멍고마","토끼마","당근마","민트마","초코마","무지개마"];let frame=0,running=true;const cards=names.map((name,i)=>{const a=document.createElement('article');a.innerHTML='<h3>'+String(i).padStart(2,'0')+' '+name+'</h3><div class="sprite"></div>';document.querySelector('main').append(a);const s=a.querySelector('.sprite');s.style.backgroundImage='url('+String(i).padStart(2,'0')+'-sheet.png)';return s});function draw(){cards.forEach(s=>s.style.backgroundPosition=(-frame*160)+'px '+(-Number(motion.value)*160)+'px')}motion.onchange=()=>{frame=0;draw()};play.onclick=()=>{running=!running;play.textContent=running?'일시정지':'재생'};setInterval(()=>{if(running){frame=(frame+1)%4;draw()}},250);draw();</script></html>
